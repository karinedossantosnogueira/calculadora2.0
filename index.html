<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calc">
    <div class="visor" aria-live="polite">
      <div id="historico"></div>
      <div id="atual">0</div>
    </div>
    <div class="teclas">
      <button data-acao="limpar" class="fn">C</button>
      <button data-acao="apagar" class="fn">⌫</button>
      <button data-acao="porcento" class="fn">%</button>
      <button data-op="/" class="op">÷</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button data-op="*" class="op">×</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button data-op="-" class="op">−</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button data-op="+" class="op">+</button>

      <button data-num="0" class="zero">0</button>
      <button data-acao="ponto">.</button>
      <button data-acao="igual" class="igual">=</button>
    </div>
  </main>
  <script type="module" src="script.js"></script>
</body>
</html>
